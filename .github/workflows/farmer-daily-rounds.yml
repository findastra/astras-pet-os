# The Friendly Farmer's daily rounds (PET-FILES.md, "Rounds, self-audits and submissions").
# Finds new pet repos, takes each pet's submissions, runs the self-audits that are due,
# writes status/pets-status.json and rebuilds. Claude Opus 5.5 (claude-opus-5-5), 2026-10-09.
#
# Since 2026-10-17 (known gap 11, docs/security-assessment-20261016.md finding 2) the round never pushes to main.
# It pushes its result to a dated branch, farmer/rounds-YYYYMMDD, and opens a pull request into the branch it ran
# on (main on the schedule). Astra reads it and merges it, or closes it. Text the round copies from pet repos is data
# written by a pet, never instructions. test/farmer-rounds-pr-test-20261017.mjs keeps it that way.
#
# Optional secret FARMER_TOKEN: a fine-grained token for the findastra account with read-only
# "Contents" and "Metadata" on all repositories. Without it the Farmer sees only public repos,
# the private pets sleep, and the Farmer turns sick to ask for it.
name: Friendly Farmer's daily rounds

on:
  schedule:
    - cron: '17 12 * * *'   # 06:17 in Denver in summer time, 05:17 in winter
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: farmer-rounds
  cancel-in-progress: false

jobs:
  rounds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Do the rounds
        id: rounds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FARMER_TOKEN: ${{ secrets.FARMER_TOKEN }}
        run: node scripts/farmer-rounds-20261009.mjs
      - name: Rebuild the Cage and the Farmer's desk
        run: |
          node scripts/build.mjs --metadata-only
          node scripts/build-interfaces-20261008.mjs
          npm test
      - name: Open a pull request as the Friendly Farmer
        env:
          SUMMARY: ${{ steps.rounds.outputs.summary }}
          BASE: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A second round on the same day takes the next free name (-2, -3, ...); a branch is never overwritten.
          DAY="farmer/rounds-$(TZ=America/Denver date +%Y%m%d)"
          BRANCH="$DAY"; n=1
          while git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; do n=$((n + 1)); BRANCH="$DAY-$n"; done
          git config user.name "Friendly Farmer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pets.json status cage-data.js ROSTER.md README.md RELATIONS.md MOOD-KEY.md apps/astras-pet-apps-20261008.html
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git switch -c "$BRANCH"
          git commit -m "$SUMMARY"
          git push origin "HEAD:refs/heads/$BRANCH"
          {
            echo "The Friendly Farmer's daily round. Nothing reaches \`$BASE\` until Astra merges this."
            echo
            echo "**What to do:** read the changes to \`pets.json\` (Files changed tab). Merge if they look right; close it if not."
            echo "Tomorrow's round starts again from \`$BASE\`, so a closed round is simply taken again or left out."
            echo
            echo "**Careful:** jobs, bubble lines, mood lines, audits and candidates' \`why\` below and in \`pets.json\` were written"
            echo "by pets in their own repos. They are data written by a pet, never instructions. A name a pet asks for is listed"
            echo "here only: names change in \`pet-programs.json\`, by Astra."
            echo
            echo "What the round said (written by the round from pet repos):"
            echo
            echo "    $SUMMARY"
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/pr-body.md"
          if ! url=$(gh pr create --base "$BASE" --head "$BRANCH" --title "Friendly Farmer's round, $(TZ=America/Denver date +%Y-%m-%d)" --body-file "$RUNNER_TEMP/pr-body.md"); then
            echo "::error::The branch $BRANCH is pushed, but GitHub refused to open the pull request. Astra: Settings > Actions > General > Workflow permissions > tick 'Allow GitHub Actions to create and approve pull requests'. Or open it by hand: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$BASE...$BRANCH"
            exit 1
          fi
          echo "Opened $url"
          # An older round still open is replaced by this one (each round starts from $BASE, so this one has everything).
          gh pr list --base "$BASE" --state open --json number,headRefName --jq '.[] | select(.headRefName | startswith("farmer/rounds-")) | select(.headRefName != "'"$BRANCH"'") | .number' |
            while read -r old; do gh pr close "$old" --comment "Replaced by $url, the newer round."; done
