    const input = h('input', undefined, '', box); input.type = 'file'; input.accept = '.csv,text/csv';
    const summary = h('p', 'No plan imported.', 'badge', box), tableWrap = h('div', undefined, 'table-wrap', box);
    let rows = [], headers = [];
    const parse = (text) => { const output = []; let row = [], cell = '', quoted = false; for (let i = 0; i < text.length; i++) { const c = text[i]; if (c === '"') { if (quoted && text[i + 1] === '"') { cell += '"'; i++; } else quoted = !quoted; } else if (c === ',' && !quoted) { row.push(cell); cell = ''; } else if (c === '\n' && !quoted) { row.push(cell.replace(/\r$/, '')); if (row.some(Boolean)) output.push(row); row = []; cell = ''; } else cell += c; } row.push(cell.replace(/\r$/, '')); if (row.some(Boolean)) output.push(row); if (quoted) throw new Error('The CSV has an unmatched quote.'); return output; };
    const render = () => { tableWrap.replaceChildren(); summary.textContent = rows.length + ' proposed actions · ' + rows.filter((r) => r.Approved === 'yes').length + ' approved'; const table = h('table', undefined, '', tableWrap), tr = h('tr', undefined, '', h('thead', undefined, '', table)); for (const label of ['Approve', 'Action', 'Source', 'Destination', 'Reason']) h('th', label, '', tr); const body = h('tbody', undefined, '', table); for (const row of rows) { const t = h('tr', undefined, '', body), td = h('td', undefined, '', t), cb = h('input', undefined, '', td); cb.type = 'checkbox'; cb.checked = row.Approved === 'yes'; cb.setAttribute('aria-label', 'Approve ' + row.Action + ' for ' + row.Source); cb.onchange = () => { row.Approved = cb.checked ? 'yes' : ''; summary.textContent = rows.length + ' proposed actions · ' + rows.filter((r) => r.Approved === 'yes').length + ' approved'; }; for (const name of ['Action', 'Source', 'Destination', 'Reason']) h('td', row[name] || '', '', t); } };
    input.onchange = async () => { try { const file = input.files[0]; if (!file) return; if (file.size > 5 * 1024 * 1024) throw new Error('Choose a CSV smaller than 5 MB.'); const data = parse((await file.text()).replace(/^\uFEFF/, '')); headers = data.shift() || []; if (!['Action', 'Source', 'Approved'].every((h) => headers.includes(h))) throw new Error('This is not a File Master plan: Action, Source and Approved columns are required.'); rows = data.map((r) => { const row = Object.fromEntries(headers.map((h, i) => [h, r[i] || ''])); row.Approved = /^\s*(y|yes|x|1|true)\s*$/i.test(row.Approved) ? 'yes' : ''; return row; }); render(); say('Plan loaded in this tab. No file actions have run.'); } catch (e) { rows = []; headers = []; render(); say(e.message); } };
    button(box, 'Export reviewed plan', () => { if (!rows.length) { say('Import a plan first.'); return; } const quote = (v) => '"' + String(v).replaceAll('"', '""') + '"'; download([headers.map(quote).join(','), ...rows.map((r) => headers.map((h) => quote(r[h] || '')).join(','))].join('\r\n'), 'csv', 'file-master-reviewed-plan'); });
    const run = card('Run the scanner separately', 'The original tools stay in control of filesystem changes.'); h('code', '.\\run-scan.cmd', '', run); h('p', 'After reviewing the exported plan, use File Master’s documented dry run before applying it. This page never runs a shell command.', 'muted', run);
  }

  if (cfg.type === 'discord') {
    const box = card('Existing local controllers', 'Start each installed companion first, then open its controls.');
    // The control panel addresses stay on this PC, in apps/<repo>-local-services-20261014.js (never committed or
    // published; docs/local-services-20261014.md). The public page only names the services.
    const row = h('div', undefined, '', box), note = h('p', '', 'muted', box);
    const show = () => { const known = window.LOCAL_SERVICES || {}; let shown = 0;
      for (const [label, id] of [['Open OpenAI controls', 'openai-discord-presence'], ['Open Anthropic controls', 'anthropic-discord-presence']]) { const url = String(known[id] || ''); if (/^http:\/\/(127\.0\.0\.1|localhost):\d{2,5}\/$/.test(url)) { link(row, label, url, 'button'); shown++; } }
      note.textContent = shown ? 'Connection status has not been checked. If a page does not open, run its existing Start … Discord Presence.cmd launcher.' : 'These controls run on your own PC. Open this page from your installed farm, with its local services file set up (docs/local-services-20261014.md).'; };
    if (location.protocol === 'file:' || ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname)) { const s = document.createElement('script'); s.src = cfg.repo + '-local-services-20261014.js'; s.onload = s.onerror = show; document.head.append(s); } else show();
    checklist('Presence checklist', ['Discord desktop is running.', 'Activity sharing is enabled in Discord.', 'The intended companion is running.', 'The profile card was inspected in Discord.', 'If both apps are running, the visible result was checked rather than assumed.']); notesCard();
  }

  if (cfg.type === 'paper') {
    const box = card('Original Paper Girl', 'Use the original app directly if it cannot appear in the embedded view.'); link(box, 'Open original Paper Girl', cfg.live, 'button'); const frame = h('iframe', undefined, 'original-app', box); frame.src = cfg.live; frame.title = 'Paper Girl original application'; frame.referrerPolicy = 'no-referrer';
  }
})();</script></body></html>
