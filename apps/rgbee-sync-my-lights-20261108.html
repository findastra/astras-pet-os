<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sync my lights · Light Hive</title>
<!-- Light Hive's sync-my-lights-tool (Astra, 2026-11-08: "I want all my RGBs, as many as I can in my entire apartment,
     to be synchronized to this"). Every light Light Hive knows, with what reaches it today, and one colour and
     brightness sent to all of them at once through Light Hive's helper on this PC. Lights the helper
     cannot reach yet say why, plainly. Claude Opus 5.5 (claude-opus-5-5), 2026-11-08. -->
<style>
:root{color-scheme:dark;--bg:#050507;--ink:#eef2f6;--dim:#93a0ad;--led1:#39ff88;--led2:#00e5ff;--led3:#ff2bd6;--led4:#ffb800;--c:#39ff88}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif}
main{padding:16px;display:grid;gap:16px}
h1{font-size:18px;margin:0}
p{margin:0;color:var(--dim)}
.controls{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:end;padding:14px 16px;border-radius:16px;border:1px solid rgba(0,229,255,.45);box-shadow:0 0 12px rgba(0,229,255,.2)}
label{display:grid;gap:4px;font-size:13px;color:var(--dim)}
input[type=color]{width:64px;height:40px;border:0;border-radius:10px;background:none;padding:0;cursor:pointer}
input[type=range]{width:180px;accent-color:var(--led1)}
.scenes{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;cursor:pointer;border-radius:999px;padding:7px 16px;border:1px solid #2b333b;background:#0c0f12;color:var(--ink)}
button.go{background:var(--led1);color:var(--bg);border:0;font-weight:650;box-shadow:0 0 12px rgba(57,255,136,.55)}
button:focus-visible,input:focus-visible{outline:2px solid var(--led2);outline-offset:3px}
.swatch{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.light{border-radius:14px;padding:12px 14px;background:#0a0c0f;border:1px solid #20262c;display:grid;gap:4px}
.light.on{border-color:var(--c);box-shadow:0 0 14px color-mix(in srgb,var(--c) 55%,transparent),inset 0 0 18px color-mix(in srgb,var(--c) 18%,transparent)}
.light b{font-weight:650}
.light small{color:var(--dim);font-size:12.5px}
.state{font-size:12.5px}
.state.ok{color:var(--led1)}.state.wait{color:var(--led4)}.state.no{color:var(--dim)}
.said{min-height:1.5em;color:var(--led2);font-size:13px}
@media (prefers-reduced-motion:no-preference){.light{transition:box-shadow .4s,border-color .4s}}
</style>
</head>
<body>
<main>
  <div>
    <h1>Sync my lights</h1>
    <p>One colour and brightness for every light Light Hive reaches. Lights it can’t reach yet say why.</p>
  </div>
  <section class="controls" aria-label="Colour for every light">
    <label>Colour <input id="color" type="color" value="#39ff88"></label>
    <label>Brightness <input id="bright" type="range" min="5" max="100" value="80"></label>
    <div class="scenes" id="scenes" aria-label="Scenes"></div>
    <button class="go" id="send" type="button">Send to every light</button>
  </section>
  <div class="said" id="said" role="status"></div>
  <section class="grid" id="lights" aria-label="Your lights"></section>
</main>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
// Light Hive's helper is found the house way (like program-watch): only a page opened on this PC reads the address it
// writes in Documents\Astra's PetOS Data\rgbee, so the live site never reaches the lights and no address is published.
const ON_THIS_PC = location.protocol === 'file:' || /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
const HELPER_DATA = "../../../Astra's PetOS Data/rgbee/light-hive-helper-data.js"; // from apps/ up to Documents
let HELPER = null;
function findHelper() {
  return new Promise((done) => {
    if (!ON_THIS_PC) { HELPER = null; done(); return; }
    const s = document.createElement('script'); s.src = HELPER_DATA + '?t=' + Date.now();
    s.onload = () => { s.remove(); const d = window.lightHiveHelper; HELPER = d && d.schema === 'light-hive-helper-v1' && Date.now() - new Date(d.time).getTime() < 60000 && /^http:\/\/(127\.0\.0\.1|localhost):\d+$/.test(d.control) ? d.control : null; done(); };
    s.onerror = () => { s.remove(); HELPER = null; done(); };
    document.head.appendChild(s);
  });
}
const SCENES = [['Neon green', '#39ff88'], ['Astra purple', '#aa3cff'], ['Ice cyan', '#00e5ff'], ['Hot pink', '#ff2bd6'], ['Sunset', '#ff7a1a'], ['Rainforest', '#127a3c'], ['Warm white', '#ffd9a8']];
// Every light Light Hive knows (2026-11-08). `via`: how it is reached; the helper's answer decides whether it is on.
const LIGHTS = [
  { name: 'Razer Seiren V3 Chroma', what: 'Desk mic', via: 'razer' },
  { name: 'Razer Kraken Ultimate', what: 'Headset ear cups', via: 'razer' },
  { name: 'Mirror', what: 'Govee light', via: 'govee' },
  { name: 'Squiggle', what: 'Govee light', via: 'govee' },
  { name: 'Lightstrip', what: 'Govee light strip', via: 'govee' },
  { name: 'Corsair K65 PLUS Wireless', what: 'Keyboard', via: 'pc' },
  { name: 'MSI Mystic Light', what: 'PC motherboard', via: 'pc' },
  { name: 'Razer Viper V3 Pro', what: 'Mouse: it has no lights', via: 'none' },
  { name: 'Mouse pad', what: 'Not found on this PC: plugged in?', via: 'none' }
];
const save = (k, v) => { try { localStorage.setItem('light-hive-sync:' + k, v); } catch (e) {} };
const load = (k) => { try { return localStorage.getItem('light-hive-sync:' + k); } catch (e) { return null; } };
if (load('color')) $('color').value = load('color');
if (load('bright')) $('bright').value = load('bright');

let answer = null;
async function ask(path, body) {
  if (!HELPER) await findHelper();
  if (!HELPER) return null;
  try { const r = await fetch(HELPER + path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {}); return await r.json(); }
  catch (e) { return null; }
}
function stateOf(l) {
  if (l.via === 'none') return ['no', 'No light to set'];
  if (!answer) return ['wait', ON_THIS_PC ? 'Waits for Light Hive’s helper on this PC' : 'Open this page from your PC’s copy to reach it'];
  if (l.via === 'razer') return answer.razer && answer.razer.ok ? ['ok', 'Reached through the Razer Chroma App'] : ['wait', 'Open the Razer Chroma App'];
  if (l.via === 'govee') return (answer.govee || []).length ? ['ok', 'Reached on your Wi-Fi (Govee LAN)'] : ['wait', 'Turn on LAN Control for it in the Govee Home app'];
  return ['wait', 'Not connected yet: needs OpenRGB (card 002)'];
}
function draw() {
  const color = $('color').value, box = $('lights'); box.replaceChildren();
  document.documentElement.style.setProperty('--c', color);
  for (const l of LIGHTS) {
    const [cls, words] = stateOf(l), card = document.createElement('article');
    card.className = 'light' + (cls === 'ok' ? ' on' : '');
    const b = document.createElement('b'), sw = document.createElement('span'); sw.className = 'swatch'; sw.style.background = cls === 'ok' ? color : '#2a3036';
    b.append(sw, document.createTextNode(l.name));
    const s = document.createElement('small'); s.textContent = l.what;
    const st = document.createElement('span'); st.className = 'state ' + cls; st.textContent = words;
    card.append(b, s, st); box.append(card);
  }
}
for (const [name, hex] of SCENES) {
  const b = document.createElement('button'); b.type = 'button';
  const sw = document.createElement('span'); sw.className = 'swatch'; sw.style.background = hex;
  b.append(sw, document.createTextNode(name));
  b.addEventListener('click', () => { $('color').value = hex; save('color', hex); draw(); send(); });
  $('scenes').append(b);
}
async function send() {
  const hex = $('color').value, n = parseInt(hex.slice(1), 16);
  const r = await ask('/color', { r: n >> 16 & 255, g: n >> 8 & 255, b: n & 255, bright: +$('bright').value });
  $('said').textContent = !r ? (ON_THIS_PC ? 'Light Hive’s helper is not running on this PC, so only the preview changed.' : 'This is the live page: it never reaches your lights. Open your PC’s copy.')
    : 'Sent: Razer ' + (r.razer === 'ok' ? 'took it' : 'did not answer') + ', ' + r.govee + ' Govee light' + (r.govee === 1 ? '' : 's') + '.';
}
$('color').addEventListener('input', () => { save('color', $('color').value); draw(); });
$('bright').addEventListener('change', () => save('bright', $('bright').value));
$('send').addEventListener('click', send);
(async () => { draw(); answer = await ask('/lights'); draw(); if (!answer) $('said').textContent = ON_THIS_PC ? 'Light Hive’s helper is not running on this PC: the lights show what they would do.' : 'This is the live page: the lights show what they would do. Open your PC’s copy to reach them.'; })();
</script>
</body>
</html>
